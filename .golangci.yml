version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unparam
  settings:
    errcheck:
      # A CLI's messages to its own stdout/stderr. Writes that carry data (the
      # refresh token from `login`) are checked explicitly.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt
    - goimports
